services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
      MYSQL_DATABASE: ${DB_NAME:-pre_consultation}
      MYSQL_CHARSET: utf8mb4
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pre-consultation-backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
      - DB_NAME=${DB_NAME:-pre_consultation}
      - JWT_SECRET=${JWT_SECRET:?请设置 JWT_SECRET 环境变量}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - JWT_REFRESH_EXPIRE_DAYS=${JWT_REFRESH_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_MODE=${AI_MODE:-degrade}
      - MAX_QUESTION_ROUNDS=${MAX_QUESTION_ROUNDS:-5}
      - CANDIDATE_THRESHOLD=${CANDIDATE_THRESHOLD:-3}
      - DISCRIMINATION_THRESHOLD=${DISCRIMINATION_THRESHOLD:-0.15}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pre-consultation-frontend:latest
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
